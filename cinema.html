<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Bridgitte: The Movie 🎬</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Inter:wght@400;500;700&family=Limelight&family=Playfair+Display:ital,wght@0,500;0,700;1,400;1,500&display=swap" rel="stylesheet">
<style>
  :root { --cream:#f6e7cf; --gold:#e2b765; --ink:#07040a; --red:#7a1a20; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--ink); overflow:hidden; font-family:Inter, system-ui, sans-serif; color:var(--cream); }
  canvas#c { position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; }
  .overlay { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; transition:opacity .9s ease, visibility .9s; z-index:20; }
  .hidden { opacity:0 !important; visibility:hidden; pointer-events:none; }
  .btn { font:500 14px Inter, sans-serif; letter-spacing:.14em; text-transform:uppercase; padding:13px 26px; border:1px solid var(--gold); border-radius:999px; background:rgba(226,183,101,.14); color:var(--cream); cursor:pointer; transition:background .25s, transform .2s; }
  .btn:hover { background:rgba(226,183,101,.3); transform:translateY(-1px); }
  .link { background:none; border:none; color:rgba(246,231,207,.55); font:400 13px Inter, sans-serif; margin-top:16px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; }

  #intro { background:linear-gradient(180deg, rgba(7,4,10,.15) 0%, rgba(7,4,10,.55) 55%, rgba(7,4,10,.88) 100%); justify-content:flex-end; padding-bottom:calc(9vh + env(safe-area-inset-bottom)); }
  #intro .small { letter-spacing:.32em; font-size:12px; color:var(--gold); text-transform:uppercase; }
  #intro h1 { font-family:Limelight, 'Playfair Display', serif; font-weight:400; font-size:clamp(34px,7vw,72px); margin:.25em 0 .1em; color:#fff6e4; text-shadow:0 0 28px rgba(255,196,110,.55); }
  #intro .sub { font-family:Caveat, cursive; font-size:clamp(24px,4.6vw,36px); color:var(--gold); margin-bottom:1.1em; }

  #ticketWrap { background:rgba(7,4,10,.55); backdrop-filter:blur(2px); gap:22px; }
  .ticket { display:flex; width:min(560px, 92vw); color:#5a1219; background:#f3e3c3; border-radius:10px; box-shadow:0 18px 60px rgba(0,0,0,.6); position:relative; text-align:left;
    animation:printUp 1.1s cubic-bezier(.2,.8,.2,1) both; }
  .ticket::before, .ticket::after { content:''; position:absolute; left:calc(76% - 11px); width:22px; height:22px; border-radius:50%; background:#1a0f12; }
  .ticket::before { top:-11px; } .ticket::after { bottom:-11px; }
  .tmain { flex:0 0 76%; padding:20px 22px 18px; border-right:2px dashed rgba(90,18,25,.4); }
  .t-admit { font:700 12px Inter, sans-serif; letter-spacing:.34em; }
  .t-title { font-family:Limelight, serif; font-size:clamp(30px,7vw,46px); line-height:1.05; margin:6px 0 2px; color:#7a1a20; }
  .t-sub { font:500 11px Inter, sans-serif; letter-spacing:.24em; opacity:.8; }
  .t-grid { display:grid; grid-template-columns:repeat(4, auto); gap:6px 14px; margin-top:14px; }
  .t-grid span { display:block; font:500 9px Inter, sans-serif; letter-spacing:.2em; opacity:.65; }
  .t-grid b { font:700 15px Inter, sans-serif; }
  .t-price { margin-top:12px; font-family:Caveat, cursive; font-size:22px; color:#7a1a20; }
  .tstub { flex:1; display:flex; align-items:center; justify-content:center; }
  .tstub div { writing-mode:vertical-rl; transform:rotate(180deg); font:700 11px Inter, sans-serif; letter-spacing:.3em; opacity:.75; }
  @keyframes printUp { from { transform:translateY(80px) rotate(-6deg) scale(.9); opacity:0; } to { transform:none; opacity:1; } }

  #mini { position:fixed; left:14px; top:calc(12px + env(safe-area-inset-top)); z-index:12; font:500 10px Inter, sans-serif; letter-spacing:.2em; color:#5a1219; background:#f3e3c3; padding:6px 10px; border-radius:4px; box-shadow:0 4px 14px rgba(0,0,0,.4); transform:rotate(-3deg); transition:opacity .8s; }
  #skip { position:fixed; right:14px; top:calc(12px + env(safe-area-inset-top)); z-index:12; }
  #skip .btn { padding:8px 14px; font-size:11px; }

  #subs { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(92px + env(safe-area-inset-bottom)); z-index:13; max-width:min(90vw,720px); text-align:center; font-family:Caveat, cursive; font-size:clamp(24px,4.6vw,34px); line-height:1.2; color:#fff; text-shadow:0 2px 6px #000, 0 0 2px #000; transition:opacity .5s; }
  #controls { position:fixed; left:50%; transform:translateX(-50%); bottom:calc(16px + env(safe-area-inset-bottom)); z-index:14; width:min(560px, 94vw); display:flex; align-items:center; gap:10px; padding:8px 12px; border-radius:999px; background:rgba(10,6,8,.6); backdrop-filter:blur(8px); border:1px solid rgba(226,183,101,.2); transition:opacity .6s; }
  #controls button { background:none; border:none; color:var(--cream); font-size:18px; width:38px; height:38px; border-radius:50%; cursor:pointer; flex:0 0 auto; }
  #controls button:hover { background:rgba(226,183,101,.18); }
  #bar { flex:1; height:4px; background:rgba(246,231,207,.16); border-radius:2px; overflow:hidden; }
  #bar i { display:block; height:100%; width:0; background:linear-gradient(90deg,#e2b765,#fff2d0); }
  #count { font-size:10px; letter-spacing:.16em; color:rgba(246,231,207,.65); white-space:nowrap; min-width:84px; text-align:right; }
  #pausedTag { position:fixed; left:50%; top:42%; transform:translate(-50%,-50%); z-index:13; font:500 13px Inter, sans-serif; letter-spacing:.3em; padding:10px 18px; border-radius:999px; background:rgba(0,0,0,.55); transition:opacity .3s; }

  #finale { background:rgba(7,4,10,.35); }
  #finale .card { background:rgba(14,8,10,.88); border:1px solid rgba(226,183,101,.35); border-radius:18px; padding:28px 26px; max-width:520px; backdrop-filter:blur(6px); }
  #finale h2 { font-family:Limelight, serif; font-weight:400; font-size:clamp(28px,5.6vw,44px); margin:0 0 .5em; color:#fff3dc; }
  #finale p { font-family:Caveat, cursive; font-size:clamp(22px,4.4vw,28px); line-height:1.3; white-space:pre-line; margin:0 0 .8em; }
  #finale .from { font-family:Caveat, cursive; font-size:28px; color:var(--gold); }
  #finale .row { display:flex; gap:12px; justify-content:center; margin-top:1.2em; flex-wrap:wrap; }
  #goal { position:fixed; left:14px; top:calc(50px + env(safe-area-inset-top)); z-index:12; font:500 13px Inter, sans-serif; color:var(--cream); background:rgba(10,6,8,.6); border:1px solid rgba(226,183,101,.3); padding:7px 12px; border-radius:8px; backdrop-filter:blur(6px); transition:opacity .5s; }
  #prompt { position:fixed; left:50%; bottom:calc(64px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:15; font:500 15px Inter, sans-serif; padding:10px 18px; border-radius:999px; background:rgba(10,6,8,.74); border:1px solid rgba(226,183,101,.45); backdrop-filter:blur(8px); color:#fff3dc; max-width:min(92vw,640px); text-align:center; transition:opacity .25s; cursor:pointer; }
  #prompt.caption { font-family:Caveat, cursive; font-size:25px; border-radius:16px; cursor:default; }
  #prompt kbd { display:inline-block; min-width:24px; padding:2px 7px; margin-right:9px; border-radius:6px; background:var(--gold); color:#2a1216; font:700 13px Inter, sans-serif; box-shadow:0 2px 0 #8a6a2a; }
  #help { position:fixed; left:50%; bottom:calc(18px + env(safe-area-inset-bottom)); transform:translateX(-50%); z-index:12; font:500 11px Inter, sans-serif; letter-spacing:.12em; color:rgba(246,231,207,.72); text-transform:uppercase; white-space:nowrap; transition:opacity .5s; text-shadow:0 1px 4px #000; }
  #help b, #intro .hint b { color:var(--gold); font-weight:700; }
  #cross { position:fixed; left:50%; top:50%; width:6px; height:6px; margin:-3px 0 0 -3px; border-radius:50%; background:rgba(255,240,210,.85); box-shadow:0 0 6px rgba(255,200,120,.8); z-index:12; pointer-events:none; transition:opacity .3s; }
  #intro .hint, #ticketHint { font:500 12px Inter, sans-serif; letter-spacing:.14em; text-transform:uppercase; color:rgba(246,231,207,.7); }
  #intro .hint { margin:-.4em 0 1.2em; }
  #subs, #help { display:none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="intro" class="overlay">
  <div class="small">Tonight only · one showing</div>
  <h1 id="intro-h"></h1>
  <div class="sub" id="intro-sub"></div>
  <div class="hint" id="introHint"></div>
  <button class="btn" id="enter">Step up to the box office</button>
  <button class="link" id="skipIntro">skip straight to my seat</button>
</div>

<div id="ticketWrap" class="overlay hidden">
  <div class="ticket" id="ticket">
    <div class="tmain">
      <div class="t-admit">ADMIT ONE</div>
      <div class="t-title" id="t-title"></div>
      <div class="t-sub">THE MOVIE · ONE NIGHT ONLY</div>
      <div class="t-grid">
        <div><span>DATE</span><b id="t-date"></b></div>
        <div><span>SCREEN</span><b>A</b></div>
        <div><span>ROW</span><b id="t-row"></b></div>
        <div><span>SEAT</span><b>1</b></div>
      </div>
      <div class="t-price">Price: one big birthday hug</div>
    </div>
    <div class="tstub"><div id="t-stub"></div></div>
  </div>
  <button class="btn" id="goInside">Head inside →</button>
  <div id="ticketHint"></div>
</div>

<div id="mini" class="hidden"></div>
<div id="goal" class="hidden"></div>
<div id="prompt" class="hidden"></div>
<div id="help" class="hidden"></div>
<div id="cross" class="hidden"></div>
<div id="skip" class="hidden"><button class="btn" id="skipBtn">Skip to my seat ›</button></div>
<div id="subs" class="hidden"></div>
<div id="pausedTag" class="hidden">PAUSED</div>
<div id="controls" class="hidden">
  <button id="prev" aria-label="Previous">⏮</button>
  <button id="play" aria-label="Pause">⏸</button>
  <button id="next" aria-label="Next">⏭</button>
  <div id="bar"><i></i></div>
  <div id="count"></div>
</div>

<div id="finale" class="overlay hidden">
  <div class="card">
    <h2 id="fin-title"></h2>
    <p id="fin-msg"></p>
    <div class="from" id="fin-from"></div>
    <div class="row">
      <button class="btn" id="again">Watch it again</button>
      <button class="btn" id="stay">Stay a while</button>
    </div>
  </div>
</div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { CONFIG } from './core.js';

/* =====================  Bridgitte: The Movie  =====================
   Street → box office (ticket) → lobby → aisle → your seat → the film.
   Photos, captions, name and messages all come from core.js.
   URL hooks:  ?seat=1  start seated   ·   ?scene=17  start the film at photo 17   ·   ?debug=1
*/
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const damp = (k,dt) => 1 - Math.exp(-k*dt);
const rnd = (a,b) => a + Math.random()*(b-a);
const smooth = t => t*t*(3-2*t);
const V3 = (x,y,z) => new THREE.Vector3(x,y,z);
const N = CONFIG.photos.length;
const STILLS = CONFIG.photos.map((p,i)=>i).filter(i=>!CONFIG.photos[i].video);
const NAME = CONFIG.name;

await Promise.race([
  Promise.all(['400 80px Limelight','italic 400 80px "Playfair Display"','700 80px "Playfair Display"','700 60px Caveat','500 40px Inter','700 40px Inter']
    .map(f => document.fonts.load(f))),
  new Promise(r => setTimeout(r, 2500)),
]);

/* ---------- renderer ---------- */
const renderer = new THREE.WebGLRenderer({ canvas:$('c'), antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
const maxAniso = renderer.capabilities.getMaxAnisotropy();
const maxTex = renderer.capabilities.maxTextureSize;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07040a);
scene.fog = new THREE.FogExp2(0x07040a, 0.011);
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.05, 260);
scene.add(camera);

function canvasTex(w, h, draw){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d'); draw(g, w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
  t.userData.ctx = g; return t;
}
function wrapLines(g, text, maxW){
  const words = String(text).split(/\s+/), out = []; let line = '';
  for (const w of words){ const test = line ? line + ' ' + w : w;
    if (g.measureText(test).width > maxW && line){ out.push(line); line = w; } else line = test; }
  if (line) out.push(line); return out;
}
const basic = (opts) => new THREE.MeshBasicMaterial(Object.assign({ toneMapped:false }, opts));
const glowTex = canvasTex(256,256,(g,w,h)=>{ const gr = g.createRadialGradient(w/2,h/2,0,w/2,h/2,w/2);
  gr.addColorStop(0,'rgba(255,226,170,.9)'); gr.addColorStop(.4,'rgba(255,200,130,.25)'); gr.addColorStop(1,'rgba(255,190,120,0)');
  g.fillStyle = gr; g.fillRect(0,0,w,h); });
const glowMat = (op=1) => basic({ map:glowTex, transparent:true, opacity:op, blending:THREE.AdditiveBlending, depthWrite:false });

/* cover-crop a photo into a small canvas texture (for posters) */
function thumb(src, w, h, onTex){
  const img = new Image();
  img.onload = () => {
    const tex = canvasTex(w, h, (g)=>{ const s = Math.max(w/img.width, h/img.height);
      const dw = img.width*s, dh = img.height*s; g.drawImage(img, (w-dw)/2, (h-dh)/2.4, dw, dh); });
    onTex(tex);
  };
  img.src = src;
}

/* ---------- materials ---------- */
const gold = new THREE.MeshStandardMaterial({ color:0xe0b264, metalness:.8, roughness:.32 });
const brass = new THREE.MeshStandardMaterial({ color:0xb98a3e, metalness:.7, roughness:.4 });
const velvet = new THREE.MeshStandardMaterial({ color:0x5a1219, roughness:.95 });
const bulbMat = basic({ color:0xfff0c8 });
scene.add(new THREE.HemisphereLight(0x8c7f9a, 0x1a0e10, 0.45));

/* =====================  ACT I · THE STREET  ===================== */
const FACADE_Z = 4;
const asphalt = canvasTex(512,512,(g,w,h)=>{ g.fillStyle='#121014'; g.fillRect(0,0,w,h);
  for (let k=0;k<5000;k++){ g.fillStyle=`rgba(255,240,220,${rnd(.01,.05)})`; g.fillRect(rnd(0,w),rnd(0,h),1.4,1.4); } });
asphalt.wrapS = asphalt.wrapT = THREE.RepeatWrapping; asphalt.repeat.set(30,15);
const ground = new THREE.Mesh(new THREE.PlaneGeometry(220,110), new THREE.MeshStandardMaterial({ map:asphalt, roughness:.9 }));
ground.rotation.x = -Math.PI/2; ground.position.set(0, -0.01, FACADE_Z + 55); scene.add(ground);
const sidewalk = new THREE.Mesh(new THREE.BoxGeometry(60, 0.16, 11), new THREE.MeshStandardMaterial({ color:0x3a3036, roughness:.85 }));
sidewalk.position.set(0, 0.08, FACADE_Z + 6); scene.add(sidewalk);
const curb = new THREE.Mesh(new THREE.BoxGeometry(60, 0.2, 0.4), new THREE.MeshStandardMaterial({ color:0x55494f, roughness:.8 }));
curb.position.set(0, 0.1, FACADE_Z + 11.6); scene.add(curb);

/* stars + moon */
{ const n = 1600, p = new Float32Array(n*3);
  for (let i=0;i<n;i++){ const a = rnd(-1.1, 1.1) + Math.PI/2, r = rnd(90, 160);
    p[i*3] = Math.cos(a)*r; p[i*3+1] = rnd(14, 110); p[i*3+2] = FACADE_Z - Math.sin(a)*r*0.6 - 20; }
  const geo = new THREE.BufferGeometry(); geo.setAttribute('position', new THREE.BufferAttribute(p,3));
  scene.add(new THREE.Points(geo, new THREE.PointsMaterial({ color:0xf3e6c8, size:.35, transparent:true, opacity:.85, fog:false }))); }
const moon = new THREE.Mesh(new THREE.PlaneGeometry(30,30), Object.assign(glowMat(1), { fog:false }));
moon.position.set(-38, 46, FACADE_Z - 70); scene.add(moon);

/* brick facade with a real doorway */
const brick = canvasTex(1024,1024,(g,w,h)=>{
  g.fillStyle='#24161a'; g.fillRect(0,0,w,h);
  for (let y=0, r=0; y<h; y+=32, r++) for (let x=-64; x<w; x+=72){
    g.fillStyle = `hsl(${rnd(4,16)},${rnd(22,38)}%,${rnd(20,30)}%)`; g.fillRect(x + (r%2?36:0), y+2, 68, 28); }
});
brick.wrapS = brick.wrapT = THREE.RepeatWrapping; brick.repeat.set(5, 4);
const brickMat = new THREE.MeshStandardMaterial({ map:brick, roughness:.9 });
const OPEN_W = 7, OPEN_H = 6.5, WALL_W = 48, WALL_H = 15;
for (const s of [-1,1]){
  const w = (WALL_W - OPEN_W)/2;
  const p = new THREE.Mesh(new THREE.BoxGeometry(w, WALL_H, 1), brickMat);
  p.position.set(s*(OPEN_W/2 + w/2), WALL_H/2, FACADE_Z); scene.add(p);
}
{ const top = new THREE.Mesh(new THREE.BoxGeometry(OPEN_W, WALL_H - OPEN_H, 1), brickMat);
  top.position.set(0, OPEN_H + (WALL_H - OPEN_H)/2, FACADE_Z); scene.add(top); }
const cornice = new THREE.Mesh(new THREE.BoxGeometry(WALL_W + 1, 0.6, 1.6), new THREE.MeshStandardMaterial({ color:0x3a262a, roughness:.8 }));
cornice.position.set(0, WALL_H, FACADE_Z + 0.2); scene.add(cornice);
/* gold trim around the doorway */
for (const [w,h,x,y] of [[0.3,OPEN_H,-OPEN_W/2,OPEN_H/2],[0.3,OPEN_H,OPEN_W/2,OPEN_H/2],[OPEN_W+0.3,0.3,0,OPEN_H]]){
  const t = new THREE.Mesh(new THREE.BoxGeometry(w,h,1.15), gold); t.position.set(x,y,FACADE_Z); scene.add(t); }
/* warm windows upstairs */
for (const x of [-18,-12.5,-7,7,12.5,18]){
  const win = new THREE.Mesh(new THREE.PlaneGeometry(2.8,3.4), basic({ color:0xffd9a0, transparent:true, opacity:.5 }));
  win.position.set(x, 12, FACADE_Z + 0.52); scene.add(win);
  const sill = new THREE.Mesh(new THREE.BoxGeometry(3.2,0.18,0.3), brass); sill.position.set(x, 10.2, FACADE_Z + 0.6); scene.add(sill);
}
/* sliding glass doors */
const doorMat = new THREE.MeshStandardMaterial({ color:0x3b1418, roughness:.35, metalness:.2, emissive:0xd98a3a, emissiveIntensity:.35, transparent:true, opacity:.88 });
const doors = [];
for (const s of [-1,1]){
  const d = new THREE.Group();
  const pane = new THREE.Mesh(new THREE.BoxGeometry(OPEN_W/2 - 0.1, OPEN_H - 0.2, 0.12), doorMat); d.add(pane);
  const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,1.4,10), gold); handle.position.set(-s*1.25, 0, 0.12); d.add(handle);
  d.position.set(s*OPEN_W/4, OPEN_H/2, FACADE_Z); d.userData.s = s; doors.push(d); scene.add(d);
}
const doorLight = new THREE.PointLight(0xffb36a, 20, 16, 2); doorLight.position.set(0, 3, FACADE_Z - 2); scene.add(doorLight);

/* the marquee */
const marqueeTex = canvasTex(1400, 340, (g,w,h)=>{
  g.fillStyle='#1b0d10'; g.fillRect(0,0,w,h);
  g.strokeStyle='#e0b264'; g.lineWidth=10; g.strokeRect(22,22,w-44,h-44);
  g.textAlign='center'; g.textBaseline='middle';
  g.shadowColor='rgba(255,200,120,.9)'; g.shadowBlur=30; g.fillStyle='#fff3dc';
  g.font='400 150px Limelight, serif'; g.fillText(NAME.toUpperCase(), w/2, 140);
  g.shadowBlur=0; g.fillStyle='#e9bd6a'; g.font='700 46px Inter, sans-serif';
  if ('letterSpacing' in g) g.letterSpacing = '10px';
  g.fillText('THE MOVIE  ·  TONIGHT ONLY', w/2, 262);
});
const MARQ_Y = 8.6, MARQ_W = 15, MARQ_H = 3.6;
const marqueeBox = new THREE.Mesh(new THREE.BoxGeometry(MARQ_W + 0.6, MARQ_H + 0.6, 1.8), new THREE.MeshStandardMaterial({ color:0x2a1418, roughness:.6, metalness:.3 }));
marqueeBox.position.set(0, MARQ_Y, FACADE_Z + 1.3); scene.add(marqueeBox);
const marqueeFace = new THREE.Mesh(new THREE.PlaneGeometry(MARQ_W, MARQ_H), basic({ map:marqueeTex }));
marqueeFace.position.set(0, MARQ_Y, FACADE_Z + 2.21); scene.add(marqueeFace);
const canopy = new THREE.Mesh(new THREE.BoxGeometry(MARQ_W + 2, 0.35, 3.4), new THREE.MeshStandardMaterial({ color:0x6d1a1c, roughness:.8 }));
canopy.position.set(0, MARQ_Y - MARQ_H/2 - 0.45, FACADE_Z + 1.8); scene.add(canopy);
const underLight = new THREE.PointLight(0xffc98a, 40, 16, 2); underLight.position.set(0, 6.0, FACADE_Z + 3.2); scene.add(underLight);
/* chase bulbs around the marquee + under the canopy */
const bulbGeo = new THREE.SphereGeometry(0.11, 10, 8);
const bulbs = [];
{ const x0 = -MARQ_W/2 - 0.15, x1 = MARQ_W/2 + 0.15, y0 = MARQ_Y - MARQ_H/2 - 0.15, y1 = MARQ_Y + MARQ_H/2 + 0.15, z = FACADE_Z + 2.25;
  const per = []; const step = 0.5;

let fwTimer = 1.2, fwWhistled = false;
function launchFirework(center, scale){
  const f = fireworks.find(f => f.life > 2.6); if (!f) return;
  { const v = center.clone().applyMatrix4(camera.matrixWorldInverse); SFX.firework(camera.position.distanceTo(center), clamp(v.x/Math.max(4, -v.z), -1, 1)*0.8, scale < 1); }
  f.life = 0; f.scale = scale; f.mat.color.setHex(fwCols[Math.floor(Math.random()*fwCols.length)]); f.mat.size = 1.4*scale;
  const sp = rnd(6, 9)*scale;
  for (let i=0;i<FW_N;i++){ const u = rnd(-1,1), a = rnd(0, Math.PI*2), r = Math.sqrt(1 - u*u), k = sp*rnd(.85, 1);
    f.pos[i*3] = center.x; f.pos[i*3+1] = center.y; f.pos[i*3+2] = center.z;
    f.vel[i*3] = r*Math.cos(a)*k; f.vel[i*3+1] = u*k; f.vel[i*3+2] = r*Math.sin(a)*k; }
}
function updateFireworks(dt, where){
  if (where){ fwTimer -= dt;
    if (fwTimer < 0.75 && !fwWhistled){ fwWhistled = true; SFX.whistle(rnd(-0.5, 0.5), where === 'hall'); }
    if (fwTimer <= 0){ fwTimer = rnd(0.9, 2.2); fwWhistled = false;
    if (where === 'sky') launchFirework(V3(rnd(-26, 26), rnd(26, 42), FACADE_Z - rnd(14, 30)), 1);
    else launchFirework(V3(rnd(-8, 8), rnd(8.2, 10.8), seatZ() - rnd(6, 12)), 0.38); } }
  for (const f of fireworks){ if (f.life > 2.6) { f.mat.opacity = 0; continue; }
    f.life += dt; const drag = Math.exp(-1.6*dt);
    for (let i=0;i<FW_N;i++){ f.vel[i*3] *= drag; f.vel[i*3+1] = f.vel[i*3+1]*drag - 3.2*f.scale*dt; f.vel[i*3+2] *= drag;
      f.pos[i*3] += f.vel[i*3]*dt; f.pos[i*3+1] += f.vel[i*3+1]*dt; f.pos[i*3+2] += f.vel[i*3+2]*dt; }
    f.geo.attributes.position.needsUpdate = true;
    f.mat.opacity = Math.pow(clamp(1 - f.life/2.6, 0, 1), 1.3) * (0.75 + 0.25*Math.sin(f.life*40)); }
}

/* photo textures: only the few around the current scene stay in memory */
const loader = new THREE.TextureLoader();
const photoCache = new Map(), waiting = new Map();
function photoTex(i, cb){
  if (photoCache.has(i)){ cb && cb(photoCache.get(i)); return photoCache.get(i); }
  if (cb){ if (!waiting.has(i)) waiting.set(i, []); waiting.get(i).push(cb); }
  if (waiting.get(i)?.loading) return null;
  if (!waiting.has(i)) waiting.set(i, []);
  waiting.get(i).loading = true;
  loader.load(CONFIG.photos[i].src, t => { t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = maxAniso;
    t.userData.aspect = t.image.width / t.image.height; photoCache.set(i, t);
    const cbs = waiting.get(i) || []; waiting.delete(i); cbs.forEach(f => f(t)); },
    undefined, () => { const cbs = waiting.get(i) || []; waiting.delete(i); cbs.forEach(f => f(null)); });
  return null;
}
function prune(center){ for (const [i,t] of [...photoCache]) if (i < center - 2 || i > center + 3){
  if (planes.some(P => P.material.map === t)) continue; t.dispose(); photoCache.delete(i); } }

/* the guitar video (or any video in the list) */
const videoEls = new Map();
function videoFor(i){
  if (videoEls.has(i)) return videoEls.get(i);
  const v = document.createElement('video'); v.src = CONFIG.photos[i].video; v.playsInline = true; v.setAttribute('playsinline',''); v.preload = 'auto';
  const tex = new THREE.VideoTexture(v); tex.colorSpace = THREE.SRGBColorSpace;
  const o = { v, tex }; videoEls.set(i, o); return o;
}
function stopVideos(){ videoEls.forEach(o => { o.v.pause(); }); }

/* the reel */
const reel = [{ kind:'leader', dur:4.0 }, { kind:'title', dur:5.5 }];
CONFIG.photos.forEach((p,i)=> reel.push(p.video ? { kind:'video', i, dur:9 } : { kind:'photo', i, dur:PHOTO_DUR,
  kb:{ zoomIn: Math.random() < .6, px:rnd(.2,.8), py:rnd(.25,.75) } }));
reel.push({ kind:'credits', dur:creditsTex.userData.dur });
const FIRST_PHOTO = 2;
let rIdx = -1, rT = 0, cur = 0, fadeT = 0, filmClock = 0, paused = false;

let music = null;
if (CONFIG.music){ music = new Audio(CONFIG.music); music.loop = true; music.volume = 0.35; music.preload = 'auto'; }
/* Phones only allow sound that starts from a tap. On the very first tap we quickly play+pause
   the music and each video, so the film can later play them with sound. */
let mediaUnlocked = false;
function unlockMedia(){
  SFX.init();
  if (mediaUnlocked) return; mediaUnlocked = true;
  if (music && music.paused && phase !== 'film'){ const pr = music.play(); music.pause(); if (pr && pr.catch) pr.catch(()=>{}); }   // unlock only: music waits for the film
  CONFIG.photos.forEach((p, i) => { if (!p.video) return;
    const o = videoFor(i); if (!o.v.paused) return;
    const pr = o.v.play(); o.v.pause(); if (pr && pr.catch) pr.catch(()=>{}); });
}
['click', 'touchend', 'keydown'].forEach(ev => addEventListener(ev, unlockMedia, { capture:true }));

function showItem(k){
  k = clamp(k, 0, reel.length - 1);
  rIdx = k; rT = 0; fadeT = 0;
  const it = reel[k];
  cur = 1 - cur;
  const P = planes[cur], O = planes[1 - cur];
  P.renderOrder = 2; O.renderOrder = 1; P.position.z = SCREEN_Z + 0.06; O.position.z = SCREEN_Z + 0.04;
  P.userData = { item:it, ready:false, t0:filmClock };
  P.visible = true;
  stopVideos(); if (music && it.kind !== 'video' && phase === 'film' && !paused && music.paused) music.play().catch(()=>{});
  const ready = (tex, aspect) => { if (P.userData.item !== it) return; P.material.map = tex; P.material.needsUpdate = true; fitPlane(P, aspect); P.userData.ready = true; };
  if (it.kind === 'leader') ready(leaderTex, 16/9);
  else if (it.kind === 'title') ready(titleTex, 16/9);
  else if (it.kind === 'credits'){ creditsTex.offset.y = 1 - creditsTex.repeat.y; ready(creditsTex, 16/9); }
  else if (it.kind === 'video'){
    const o = videoFor(it.i); o.v.currentTime = 0; o.v.muted = false; if (music) music.pause();   // music rests while a video plays
    const go = () => ready(o.tex, (o.v.videoWidth || 16) / (o.v.videoHeight || 9));
    if (o.v.readyState >= 1) go(); else o.v.addEventListener('loadedmetadata', go, { once:true });
    if (!paused) o.v.play().catch(()=>{ o.v.muted = true; o.v.play().catch(()=>{}); });   // if sound is blocked, still show it
  } else {
    photoTex(it.i, t => { if (t) ready(t, t.userData.aspect); else { it.dur = 0; P.userData.ready = true; } });
    for (const j of [it.i + 1, it.i + 2]) if (j < N && !CONFIG.photos[j].video) photoTex(j);
    prune(it.i);
  }
  const showCap = it.kind === 'photo' || it.kind === 'video';
  $('subs').textContent = showCap ? CONFIG.photos[it.i].caption : '';
  $('subs').classList.toggle('hidden', !showCap);
  $('count').textContent = showCap ? 'SCENE ' + (it.i + 1) + ' / ' + N : it.kind === 'credits' ? 'CREDITS' : it.kind === 'title' ? 'OPENING' : '';
}
function setPaused(p){
  paused = p; SFX.projector(!p && phase === 'film'); $('play').textContent = p ? '▶' : '⏸'; $('pausedTag').classList.toggle('hidden', !p);
  const it = reel[rIdx];
  if (it && it.kind === 'video'){ const o = videoFor(it.i); p ? o.v.pause() : o.v.play().catch(()=>{}); }
  if (music){ if (p) music.pause(); else if (!(it && it.kind === 'video')) music.play().catch(()=>{}); }
}
function updateFilm(dt){
  const it = reel[rIdx]; if (!it) return;
  const P = planes[cur], O = planes[1 - cur];
  if (P.userData.ready && !paused){ rT += dt; filmClock += dt; }
  if (it.kind === 'leader') drawLeader(rT, it.dur);
  if (it.kind === 'credits') creditsTex.offset.y = (1 - creditsTex.repeat.y) * (1 - clamp(rT/it.dur, 0, 1));
  if (it.kind === 'video'){ const v = videoFor(it.i).v; if (v.duration) it.dur = v.duration + 0.4; }
  if (P.userData.ready) fadeT += dt;
  const f = smooth(clamp(fadeT/FADE, 0, 1));
  P.material.opacity = P.userData.ready ? f : 0;
  O.material.opacity = P.userData.ready ? 1 - f : O.material.opacity;
  O.visible = O.material.opacity > 0.002;
  for (const pl of planes){ const pi = pl.userData.item;      // slow Ken Burns push on photos
    if (!pi || pi.kind !== 'photo' || !pl.material.map) continue;
    // grow/shrink the whole picture inside the screen, so nothing is ever cropped
    const prog = clamp((filmClock - pl.userData.t0)/(pi.dur + FADE), 0, 1), s = 0.93 + 0.07*smooth(pi.kb.zoomIn ? prog : 1 - prog);
    pl.scale.set(pl.userData.bw*s, pl.userData.bh*s, 1); }
  $('bar').firstElementChild.style.width = (clamp((rIdx + clamp(rT/it.dur,0,1))/reel.length, 0, 1)*100).toFixed(2) + '%';
  if (rT >= it.dur){ if (rIdx < reel.length - 1) showItem(rIdx + 1); else endFilm(); }
}


/* =====================  SOUND EFFECTS (all synthesized live, no audio files)  ===================== */
const SFX = (() => {
  let ctx = null, out = null, wet = null, noiseBuf = null, ambOut = null, ambIn = null, proj = null;
  const on = () => !!ctx && ctx.state === 'running';
  function init(){
    if (ctx){ if (ctx.state !== 'running') ctx.resume().catch(()=>{}); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    try { ctx = new AC(); } catch(e){ return; }
    out = ctx.createGain(); out.gain.value = 0.85; out.connect(ctx.destination);
    const sr = ctx.sampleRate;
    noiseBuf = ctx.createBuffer(1, sr*2, sr); const d = noiseBuf.getChannelData(0);

  const r = 0.32, list = doorOpen < 0.6 ? WALLS.concat([DOOR_RECT]) : WALLS;
  for (let pass = 0; pass < 2; pass++) for (const w of list){
    const cx = clamp(P.x, w.x0, w.x1), cz = clamp(P.z, w.z0, w.z1), dx = P.x - cx, dz = P.z - cz, d2 = dx*dx + dz*dz;
    if (d2 >= r*r) continue;
    if (d2 > 1e-8){ const d = Math.sqrt(d2), k = (r - d)/d; P.x += dx*k; P.z += dz*k; }
    else { const l = P.x - w.x0, rr = w.x1 - P.x, b = P.z - w.z0, t = w.z1 - P.z, m = Math.min(l, rr, b, t);
      if (m === l) P.x = w.x0 - r; else if (m === rr) P.x = w.x1 + r; else if (m === b) P.z = w.z0 - r; else P.z = w.z1 + r; }
  }
}

/* a glowing "YOUR SEAT" marker */
const seatMarker = new THREE.Group();
{ const tx = canvasTex(320, 120, (g,w,h)=>{ g.textAlign='center'; g.textBaseline='middle'; g.fillStyle='#ffe2a0';
    g.shadowColor='rgba(255,180,90,.95)'; g.shadowBlur=16; g.font='700 40px Inter, sans-serif'; g.fillText('YOUR SEAT', w/2, 38);
    g.font='700 40px Inter, sans-serif'; g.fillText('▼', w/2, 92); });
  const label = new THREE.Sprite(new THREE.SpriteMaterial({ map:tx, transparent:true, depthWrite:false, depthTest:false, fog:false, toneMapped:false }));
  label.scale.set(1.7, 0.64, 1); seatMarker.add(label);
  const glow = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTex, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false, fog:false, toneMapped:false, opacity:.85 }));
  glow.scale.set(2.4, 2.4, 1); glow.position.y = -1.35; seatMarker.add(glow); }
seatMarker.visible = false; scene.add(seatMarker);

function lock(){ if (!GAME) return; try { const r = stageEl.requestPointerLock(); if (r && r.catch) r.catch(()=>{}); } catch(e){} }
function exitLock(){ if (document.pointerLockElement) document.exitPointerLock(); }
const locked = () => document.pointerLockElement === stageEl;

function startRoam(){
  $('intro').classList.add('hidden');
  Object.assign(P, { x:0, z:30, yaw:0, pitch:0.1, vx:0, vz:0 }); P.y = 1.7;
  setPhase('roam'); lock();
}
function getTicket(){
  ticketOpen = true; keys.clear(); exitLock(); SFX.ticket();
  $('ticketWrap').classList.remove('hidden');
  const t = $('ticket'); t.style.animation = 'none'; void t.offsetWidth; t.style.animation = '';
}
function closeTicket(){
  ticketOpen = false; hasTicket = true;
  $('ticketWrap').classList.add('hidden'); $('mini').classList.remove('hidden'); lock();
}
function takeSeat(){
  keys.clear(); exitLock();
  sitFrom = { pos:camera.position.clone(), q:camera.quaternion.clone() };
  setPhase('sitting');
}
function standUp(){
  $('finale').classList.add('hidden'); stopVideos(); if (music) music.pause(); confettiOn = false; SFX.projector(false);
  planes.forEach(pl => { pl.visible = false; pl.material.opacity = 0; pl.userData.item = null; }); $('subs').classList.add('hidden');
  Object.assign(P, { x:0.2, z:seatZ() + 0.95, yaw:0, pitch:0.05, vx:0, vz:0 }); P.y = 1.7 + floorY(P.z);
  setPhase('roam'); lock();
}

/* what can you do right where you're standing? */
function findAction(){
  const px = P.x, pz = P.z;
  if (!hasTicket){
    if (Math.hypot(px - KIOSK.x, pz - (KIOSK.z + 2.0)) < 2.5) return { key:true, text:'Get your ticket', act:getTicket };
    if (Math.abs(px) < 4.6 && pz > FACADE_Z && pz < FACADE_Z + 3.4) return { text:'🔒 The doors are locked. Grab a ticket at the box office first' };
  }
  if (pz < AUD_Z0){
    const sz = seatZ(), L = rowLetter(seatRow);
    if (Math.hypot(px - 0.55, pz - (sz + 0.9)) < 1.25) return { key:true, text:`Take your seat · Row ${L}, Seat 1`, act:takeSeat };
    for (let r = 0; r < ROWS.length; r++) if (Math.abs(px) < 1.6 && Math.abs(pz - (ROWS[r] + 0.9)) < 0.8)
      return { text:`Row ${rowLetter(r)}. Your seat is Row ${L}, keep going` };
  }
  if (pz < FACADE_Z && pz > AUD_Z0){                 // NOW SHOWING posters
    const fx = -Math.sin(P.yaw), fz = -Math.cos(P.yaw); let best = null, bd = 2.6;
    for (const p of POSTER_SPOTS){ const dx = p.x - px, dz = p.z - pz, d = Math.hypot(dx, dz);
      if (d < bd && (dx*fx + dz*fz)/d > 0.55){ best = p; bd = d; } }
    // (poster captions turned off)
  }
  return null;
}
function showPrompt(a){
  const el = $('prompt');
  if (!a){ el.classList.add('hidden'); return; }
  const html = (a.key ? '<kbd>E</kbd>' : '') + a.text.replace(/</g, '&lt;');
  if (el.dataset.html !== html){ el.innerHTML = html; el.dataset.html = html; }
  el.classList.toggle('caption', !!a.caption); el.classList.remove('hidden');
}
function gameUI(p){
  const roam = p === 'roam';
  $('help').classList.toggle('hidden', !roam);
  $('goal').classList.toggle('hidden', !roam);
  if (!roam){ $('prompt').classList.add('hidden'); $('cross').classList.add('hidden'); seatMarker.visible = false; }
}

const fQ = new THREE.Quaternion(), fM = new THREE.Matrix4(), fPos = V(0,0,0), fLook = V(0,0,0);
function driveFree(dt){
  if (phase === 'sitting'){
    const t = smooth(clamp(phaseT/1.8, 0, 1));
    seatPose(fPos, fLook); fM.lookAt(fPos, fLook, camera.up); fQ.setFromRotationMatrix(fM);
    camera.position.lerpVectors(sitFrom.pos, fPos, t); camera.quaternion.slerpQuaternions(sitFrom.q, fQ, t);
    if (phaseT >= 1.9){ yawOff = 0; pitchOff = 0; sitDown(0); }
    return;
  }
  let f = 0, s = 0;
  if (!ticketOpen){
    if (keys.has('KeyW') || keys.has('ArrowUp')) f += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
    if (keys.has('KeyD')) s += 1;
    if (keys.has('KeyA')) s -= 1;
    if (keys.has('ArrowLeft')) P.yaw += 1.9*dt;
    if (keys.has('ArrowRight')) P.yaw -= 1.9*dt;
  }
  const speed = keys.has('ShiftLeft') || keys.has('ShiftRight') ? 7.5 : 3.8, n = Math.hypot(f, s) || 1;
  const sn = Math.sin(P.yaw), cs = Math.cos(P.yaw);
  const tx = (-sn*f + cs*s)/n*speed, tz = (-cs*f - sn*s)/n*speed;
  P.vx += (tx - P.vx)*damp(9, dt); P.vz += (tz - P.vz)*damp(9, dt);
  P.x += P.vx*dt; P.z += P.vz*dt; collide();
  const v = Math.hypot(P.vx, P.vz); P.bobT += v*dt*2.4;
  P.y += (1.7 + floorY(P.z) - P.y)*damp(12, dt);
  const amp = 0.045*Math.min(1, v/3.8);
  camera.position.set(P.x + Math.cos(P.bobT*0.5)*amp*0.5, P.y + Math.abs(Math.sin(P.bobT*0.5))*amp, P.z);
  camera.rotation.set(P.pitch, P.yaw, 0, 'YXZ');
}
function gameTick(){
  if (!GAME) return;
  if (phase === 'roam'){
    curAct = ticketOpen ? null : findAction(); showPrompt(curAct);
    $('cross').classList.toggle('hidden', !locked() || ticketOpen);
    const L = rowLetter(seatRow);
    const goal = hasTicket ? `🍿 Find Row ${L}, Seat 1 in Screen A` : '🎟️ Get a ticket at the box office';
    if ($('goal').textContent !== goal) $('goal').textContent = goal;
    $('help').innerHTML = '<b>WASD</b> walk &nbsp;·&nbsp; <b>Mouse</b> look &nbsp;·&nbsp; <b>Shift</b> run &nbsp;·&nbsp; <b>E</b> interact' + (locked() ? '' : ' &nbsp;·&nbsp; click to look around');
    seatMarker.visible = hasTicket;
    seatMarker.position.set(SEAT_X, floorY(seatZ()) + 2.5 + Math.sin(time*2.2)*0.12, seatZ());
  } else if (phase === 'end' && $('finale').classList.contains('hidden')){
    curAct = { key:true, text:'Stand up and look around', act:standUp }; showPrompt(curAct);
  } else if (phase === 'end'){ curAct = null; showPrompt(null); }
}

if (GAME){
  $('enter').textContent = 'Walk up to the theatre';
  $('introHint').innerHTML = 'WASD to walk · mouse to look · <b>E</b> to interact';
  $('goInside').textContent = 'Keep exploring →';
  $('ticketHint').textContent = 'or press E';
  $('stay').textContent = 'Stand up & look around';
} else { $('introHint').remove(); $('ticketHint').remove(); }
$('prompt').onclick = () => { if (curAct && curAct.act) curAct.act(); };
document.addEventListener('mousemove', e => {
  if (!locked() || phase !== 'roam' || ticketOpen) return;
  P.yaw -= e.movementX*0.0022; P.pitch = clamp(P.pitch - e.movementY*0.0022, -1.25, 1.25);
});
addEventListener('keydown', e => {
  if (!GAME) return;
  if (ticketOpen && (e.code === 'KeyE' || e.key === 'Enter' || e.key === 'Escape')){ e.preventDefault(); closeTicket(); return; }
  if (e.code === 'KeyE' && curAct && curAct.act && (phase === 'roam' || phase === 'end')){ e.preventDefault(); curAct.act(); return; }
  if (phase === 'roam'){
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space'].includes(e.code)) e.preventDefault();
    keys.add(e.code);
  }
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => keys.clear());

/* =====================  LOOP  ===================== */
const camPos = V(0,0,0), camLook = V(0,0,0), tmpPos = V(0,0,0), tmpLook = V(0,0,0);
const params = new URLSearchParams(location.search);
if (params.get('scene')) sitDown(FIRST_PHOTO + clamp((parseInt(params.get('scene'),10) || 1) - 1, 0, N - 1));
else if (params.get('seat')) sitDown(0);
if (params.get('debug')) window.__DBG = { SFX, get music(){ return music; }, P, keys, startRoam, get act(){ return curAct; }, get hasTicket(){ return hasTicket; }, THREE, scene, camera, get phase(){ return phase; }, showItem, reel, step:(n=1, dt=1/30)=>{ for (let i=0;i<n;i++) step(dt); }, go:(p)=>{ if (p==='walk1') $('enter').click(); else if (p==='walk2') goInside(); } };

let time = 0, last = performance.now();
function step(dt){
  time += dt; phaseT += dt;

  const free = phase === 'roam' || phase === 'sitting';
  if (free) driveFree(dt);
  else if (phase === 'street'){ camPos.copy(STREET_POS); camLook.copy(STREET_LOOK); }
  else if (phase === 'walk1'){ const t = smooth(clamp(phaseT/6.5, 0, 1));
    camPos.lerpVectors(STREET_POS, KIOSK_POS, t); camLook.lerpVectors(STREET_LOOK, KIOSK_LOOK, smooth(t));
    if (phaseT >= 6.8) giveTicket(); }
  else if (phase === 'ticket'){ camPos.copy(KIOSK_POS); camLook.copy(KIOSK_LOOK); }
  else if (phase === 'walk2'){ walkAt(phaseT, camPos, camLook); if (phaseT >= walkTotal + 1.6) sitDown(pendingStart); }
  else seatPose(camPos, camLook);

  if (phase === 'dim'){ seatPose(tmpPos, tmpLook); camPos.copy(tmpPos); if (phaseT > 3.4) startFilm(); }
  const seated = phase === 'dim' || phase === 'film' || phase === 'end';
  const fovT = seated || phase === 'sitting' ? seatedFov() : free ? 70 : walkFov();
  camera.fov += (fovT - camera.fov) * damp(seated ? 1.5 : 4, dt); camera.updateProjectionMatrix();

  if (!free){
  const bob = seated ? 0 : (phase === 'street' || phase === 'ticket' ? 0.015 : 0.03);
  camera.position.set(camPos.x + Math.sin(time*0.7)*bob, camPos.y + Math.sin(time*1.9)*bob, camPos.z);
  camera.lookAt(camLook);
  if (!ptr){ yawOff *= Math.exp(-dt*1.6); pitchOff *= Math.exp(-dt*1.6); }
  camera.rotateY(yawOff); camera.rotateX(pitchOff);
  }

  /* doors slide open as you approach */
  const open = (GAME && !hasTicket) ? 0 : clamp((FACADE_Z + 8 - camera.position.z)/4, 0, 1); doorOpen = open;
  if (open > 0.03 && prevDoor <= 0.03) SFX.door(); prevDoor = open;
  doors.forEach(d => d.position.x = d.userData.s * (OPEN_W/4 + smooth(open)*(OPEN_W/2 + 0.2)));

  /* house lights, curtains, projector */
  const houseT = phase === 'film' ? 0.05 : phase === 'end' ? 0.55 : phase === 'dim' ? 0.05 : 1;
  house += (houseT - house) * damp(phase === 'dim' ? 1.1 : 1.6, dt);
  houseLights.forEach(l => l.intensity = l.userData.full*house);
  sconceMat.color.setScalar(0.25 + 0.75*house);
  const curtT = (phase === 'dim' && phaseT > 1.0) || phase === 'film' || phase === 'end' ? 1 : 0;
  if (curtT === 1 && !curtSfx){ curtSfx = true; SFX.curtain(); } else if (curtT === 0) curtSfx = false;
  curtainOpen += (curtT - curtainOpen) * damp(0.9, dt);
  curtains.forEach(c => c.m.position.x = c.s*(CURT_W/2 + smooth(clamp(curtainOpen,0,1))*(CURT_W - 0.6)));
  const proj = phase === 'film' || phase === 'end' ? 1 : 0;
  beam.material.opacity += (proj*0.018 - beam.material.opacity) * damp(2, dt);
  dust.material.opacity += (proj*0.5 - dust.material.opacity) * damp(2, dt);
  screenLight.intensity += (proj*16 - screenLight.intensity) * damp(2, dt);
  dust.rotation.z = time*0.01;

  if (phase === 'film') updateFilm(dt);
  gameTick();

  /* marquee chase */
  const chase = Math.floor(time*8);
  bulbs.forEach((b,i) => b.scale.setScalar(((i + chase) % 3) ? 1 : 0.35));

  /* confetti */
  if (confettiOn || confettiT < 12){ confettiT += dt;
    for (let i=0;i<CONF;i++){ const c = confS[i];
      c.p.y -= c.v*dt; c.p.x += Math.sin(time*2 + c.ph)*0.006;
      c.r.x += c.rv.x*dt; c.r.y += c.rv.y*dt; c.r.z += c.rv.z*dt;
      if (c.p.y < floorY(c.p.z)){ if (confettiOn && confettiT < 9) respawn(c, false); else c.p.y = -20; }
      dummy.position.copy(c.p); dummy.rotation.copy(c.r); dummy.scale.setScalar(c.p.y > -10 && c.p.y < AUD_H ? 1 : 0);
      dummy.updateMatrix(); confetti.setMatrixAt(i, dummy.matrix); }
    confetti.instanceMatrix.needsUpdate = true; }

  soundTick(dt);

  /* magic */
  sparkleMats.forEach(m => m.uniforms.uTime.value = time);
  starCeil.uniforms.uOpacity.value = 0.35 + 0.65*(1 - house);
  stageSpark.uniforms.uOpacity.value = seated ? 0.12 + 1.6*Math.sin(clamp(curtainOpen, 0, 1)*Math.PI) : 0;
  searchlights.forEach(L => L.g.rotation.set(-0.32 + Math.sin(time*0.21 + L.ph)*0.12, 0, L.s*0.32 + Math.sin(time*0.33 + L.ph)*0.42));
  chandeliers.forEach((c,k) => c.rotation.y = time*0.05*(k ? -1 : 1));
  footBulbs.forEach((b,i) => b.scale.setScalar(0.8 + 0.2*Math.sin(time*3 + i*0.6)));
  const outside = (phase === 'roam' && camera.position.z > FACADE_Z - 3) || phase === 'street' || phase === 'walk1' || phase === 'ticket' || (phase === 'walk2' && phaseT < 4);
  updateFireworks(dt, outside ? 'sky' : phase === 'end' ? 'hall' : null);

  renderer.render(scene, camera);
}
function frame(){
  const now = performance.now(), dt = Math.min(0.05, (now - last)/1000); last = now;
  step(dt);
  requestAnimationFrame(frame);
}
addEventListener('resize', () => { camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth, innerHeight); });
requestAnimationFrame(frame);
</script>
